<app-modal [title]="event.entityName + ' Details'" (close)="close.emit()">
  <div class="details-container">
    <div *ngIf="loading" class="loading-state">
      <div class="spinner"></div>
      <p>Fetching extra details...</p>
    </div>

    <div *ngIf="error" class="error-msg">
      {{ error }}
    </div>

    <table class="details-table" *ngIf="allData.length > 0">
      <thead>
        <tr>
          <th>Field</th>
          <th>Value</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let item of allData">
          <td class="field-key">{{ item.key }}</td>
          <td class="field-value">{{ item.value }}</td>
        </tr>
      </tbody>
    </table>

    <div class="actions" style="margin-top: 24px; text-align: right;">
        <button class="primary-btn" (click)="close.emit()">Close</button>
    </div>
  </div>
</app-modal>
